<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dough Re Mi | Pizza-on-Demand</title>
</head>
<body>
    <h1>Dough Re Mi | Pizza-on-Demand</h1>
    <p>Our 12" wood-fired pizzas are available for delivery. Build your custom pizza and we'll deliver it within an hour.</p>

    <form action="http://blackgoosebistro.com/pizza.php" method="POST">

        <fieldset>
            <legend>Your Information</legend>
            <label for="customername">Name:</label>
            <input type="text" id="customername" name="customername"><br>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address"><br>

            <label for="telephone">Telephone Number:</label>
            <input type="tel" id="telephone" name="telephone"><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br>

            <label for="instructions">Delivery instructions:</label><br>
            <textarea id="instructions" name="instructions" rows="4" cols="40"
                maxlength="400" placeholder="No more than 400 characters long"></textarea>
        </fieldset>

        <fieldset>
            <legend>Design Your Dream Pizza</legend>

            <p>Crust (Choose one):</p>
            <input type="radio" id="classic" name="crust" value="Classic white">
            <label for="classic">Classic white</label><br>
            <input type="radio" id="multigrain" name="crust" value="Multigrain">
            <label for="multigrain">Multigrain</label><br>
            <!-- lanjutkan: Cheese-stuffed crust dan Gluten-free -->

            <p>Toppings (Choose as many as you want):</p>
            <input type="checkbox" id="red" name="toppings[]" value="Red sauce" checked>
            <label for="red">Red sauce</label><br>
            <input type="checkbox" id="white" name="toppings[]" value="White sauce">
            <label for="white">White sauce</label><br>
            <!-- lanjutkan: Mozzarella Cheese, Pepperoni, Mushrooms, Peppers, Anchovies -->

            <label for="number">How many pizzas:</label>
            <select id="number" name="number">
                <option value="1">1</option>
                <option value="2">2</option>
                <!-- lanjutkan sampai 6 -->
            </select>
        </fieldset>

        <input type="submit" value="Bring me a pizza!">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
